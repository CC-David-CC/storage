[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "webos-storage"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["aiohttp==3.14.5", "webos-accounts==0.1.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
webos_storage = ["*.mjs", "vendor/js-sha256/*"]
